name: Event Platform Tests

on:
  push:
    paths:
      - "projects/event-driven-data-platform/**"
      - ".github/workflows/event-platform-tests.yml"
  pull_request:
    paths:
      - "projects/event-driven-data-platform/**"
      - ".github/workflows/event-platform-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/event-driven-data-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: pytest -q
