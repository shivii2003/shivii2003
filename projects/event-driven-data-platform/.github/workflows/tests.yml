name: Event Platform Tests

on:
  push:
    paths:
      - "projects/event-driven-data-platform/**"
  pull_request:
    paths:
      - "projects/event-driven-data-platform/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/event-driven-data-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -q
