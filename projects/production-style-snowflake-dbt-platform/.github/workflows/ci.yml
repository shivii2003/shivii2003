name: data-platform-ci
on:
  push:
    paths:
      - "projects/production-style-snowflake-dbt-platform/**"
  pull_request:
    paths:
      - "projects/production-style-snowflake-dbt-platform/**"
jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/production-style-snowflake-dbt-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest -q
